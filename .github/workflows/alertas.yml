name: Alertas de precio

on:
  schedule:
    # Cada 30 min, lun-vie, 12:00-21:59 UTC (cubre horario Bolsa de Santiago y NYSE, con y sin horario de verano)
    - cron: "*/30 12-21 * * 1-5"
  workflow_dispatch: {}  # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: read

concurrency:
  group: alertas
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Recuperar estado anterior
        uses: actions/cache/restore@v4
        with:
          path: state
          key: estado-${{ github.run_id }}
          restore-keys: estado-

      - name: Revisar precios
        run: python alertas.py
        env:
          ALERTAS_CONFIG: ${{ secrets.ALERTAS_CONFIG }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          MARGEN_PCT: "1"

      - name: Guardar estado
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: estado-${{ github.run_id }}
